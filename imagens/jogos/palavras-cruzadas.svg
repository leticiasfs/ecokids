<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- EcoKids: ilustração das Palavras cruzadas (desenho próprio do projeto, estilo massinha).
       Palavras: FLOR (deitada), SOL e RIO (em pé). -->
  <defs>
    <filter id="massa" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="b"/>
      <feSpecularLighting in="b" surfaceScale="4" specularConstant=".7" specularExponent="30" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="48"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="brilho"/>
      <feOffset in="SourceAlpha" dx="-3" dy="-5"/><feGaussianBlur stdDeviation="3.2" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="arithmetic" k2="1" k3="-1" result="borda"/>
      <feFlood flood-color="#3a0d00" flood-opacity=".3"/><feComposite in2="borda" operator="in" result="sombra"/>
      <feMerge result="m"><feMergeNode in="SourceGraphic"/><feMergeNode in="sombra"/></feMerge>
      <feComposite in="m" in2="brilho" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="chao" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <rect id="casa" width="36" height="36" rx="9"/>
  </defs>
  <ellipse cx="124" cy="186" rx="84" ry="8" fill="#3a0d00" opacity=".28" filter="url(#chao)"/>
  <!-- casas (creme) e a casa do cruzamento (amarela) -->
  <g filter="url(#massa)" fill="#fff6df">
    <use href="#casa" x="122" y="14"/>
    <use href="#casa" x="42" y="56"/><use href="#casa" x="82" y="56"/><use href="#casa" x="162" y="56"/>
    <use href="#casa" x="122" y="96"/><use href="#casa" x="162" y="96"/>
    <use href="#casa" x="162" y="136"/>
  </g>
  <g filter="url(#massa)" fill="#ffc531"><use href="#casa" x="122" y="56"/></g>
  <g font-family="Fredoka, 'Arial Rounded MT Bold', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="23" fill="#1d5a3b" text-anchor="middle">
    <text x="140" y="40">S</text>
    <text x="60" y="82">F</text><text x="100" y="82">L</text><text x="140" y="82" fill="#7a4a00">O</text><text x="180" y="82">R</text>
    <text x="140" y="122">L</text><text x="180" y="122">I</text>
    <text x="180" y="162">O</text>
  </g>
  <!-- lápis -->
  <g transform="translate(70 150) rotate(-32)">
    <g filter="url(#massa)"><rect x="-38" y="-9" width="62" height="18" rx="5" fill="#ff9f1c"/><rect x="-52" y="-9" width="16" height="18" rx="6" fill="#ff8fab"/><rect x="-40" y="-9.5" width="7" height="19" fill="#c9ced6"/></g>
    <path d="M23-9 44 0 23 9Z" fill="#f8d9a8" stroke="#f8d9a8" stroke-width="2" stroke-linejoin="round"/>
    <path d="M37-3 44 0 37 3Z" fill="#4a3426"/>
    <path d="M-30-4h46" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  </g>
  <g stroke="#ffd447" stroke-width="5.5" stroke-linecap="round"><path d="M28 30l8 9"/><path d="M22 48l12 1"/><path d="M42 20l1 12"/></g>
</svg>
