<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- EcoKids: ilustração do Jogo da memória (desenho próprio do projeto, estilo massinha) -->
  <defs>
    <!-- "massinha": luz no alto à esquerda e sombra por dentro embaixo à direita -->
    <filter id="massa" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feSpecularLighting in="b" surfaceScale="5" specularConstant=".75" specularExponent="30" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="48"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="brilho"/>
      <feOffset in="SourceAlpha" dx="-5" dy="-7"/><feGaussianBlur stdDeviation="5" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="arithmetic" k2="1" k3="-1" result="borda"/>
      <feFlood flood-color="#1a1000" flood-opacity=".32"/><feComposite in2="borda" operator="in" result="sombra"/>
      <feMerge result="m"><feMergeNode in="SourceGraphic"/><feMergeNode in="sombra"/></feMerge>
      <feComposite in="m" in2="brilho" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="chao" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <ellipse cx="122" cy="184" rx="82" ry="9" fill="#0b2a14" opacity=".28" filter="url(#chao)"/>
  <!-- carta de trás (verso azul com folha) -->
  <g transform="rotate(-13 86 104)">
    <rect x="38" y="38" width="96" height="134" rx="20" fill="#3b9de3" filter="url(#massa)"/>
    <rect x="52" y="52" width="68" height="106" rx="13" fill="none" stroke="#bfe3ff" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
    <g transform="translate(86 105)" filter="url(#massa)">
      <path d="M-20 14C-22-8-6-22 20-20 22 2 8 18-20 14Z" fill="#7ed957"/>
    </g>
    <path d="M-16 10C-6 0 4-8 14-14" transform="translate(86 105)" fill="none" stroke="#3f9a37" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- carta da frente (estrela) -->
  <g transform="rotate(9 152 108)">
    <rect x="104" y="40" width="96" height="134" rx="20" fill="#fff7e4" filter="url(#massa)"/>
    <g transform="translate(152 108)" filter="url(#massa)">
      <path d="M0-36 9.99-13.75 34.24-11.12 16.17 5.25 21.16 29.12 0 17-21.16 29.12-16.17 5.25-34.24-11.12-9.99-13.75Z" fill="#ffc531" stroke="#ffc531" stroke-width="9" stroke-linejoin="round"/>
    </g>
    <circle cx="144" cy="104" r="3.6" fill="#5a3a00"/><circle cx="160" cy="104" r="3.6" fill="#5a3a00"/>
    <path d="M145 113q7 6 14 0" fill="none" stroke="#5a3a00" stroke-width="3" stroke-linecap="round"/>
    <circle cx="139" cy="112" r="3.4" fill="#ff8a65" opacity=".6"/><circle cx="165" cy="112" r="3.4" fill="#ff8a65" opacity=".6"/>
  </g>
  <!-- brilhos e folhinhas -->
  <g stroke="#ffd447" stroke-width="6" stroke-linecap="round"><path d="M206 30l8-12"/><path d="M216 46l14-5"/><path d="M196 22l1-14"/></g>
  <g filter="url(#massa)"><path d="M14 150c2-16 16-24 30-20-2 15-15 23-30 20Z" fill="#6cc04a"/><path d="M24 172c10-10 24-10 32-2-10 9-23 10-32 2Z" fill="#58b043"/></g>
</svg>
