<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- EcoKids: ilustração da Lixeira certa (desenho próprio do projeto, estilo massinha). Cores oficiais das lixeiras. -->
  <defs>
    <filter id="massa" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="b"/>
      <feSpecularLighting in="b" surfaceScale="5" specularConstant=".75" specularExponent="30" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="48"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="brilho"/>
      <feOffset in="SourceAlpha" dx="-4" dy="-6"/><feGaussianBlur stdDeviation="4.5" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="arithmetic" k2="1" k3="-1" result="borda"/>
      <feFlood flood-color="#1a1000" flood-opacity=".32"/><feComposite in2="borda" operator="in" result="sombra"/>
      <feMerge result="m"><feMergeNode in="SourceGraphic"/><feMergeNode in="sombra"/></feMerge>
      <feComposite in="m" in2="brilho" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="chao" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <!-- lixeira: corpo, tampa e alça (a cor vem de "fill" no <use>) -->
    <symbol id="corpo" viewBox="0 0 48 64" overflow="visible"><path d="M0 0h48l-4.5 57a7 7 0 0 1-7 7h-25a7 7 0 0 1-7-7Z"/></symbol>
    <symbol id="reciclar" viewBox="0 0 24 24" overflow="visible"><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></g></symbol>
  </defs>
  <ellipse cx="120" cy="184" rx="104" ry="9" fill="#00201c" opacity=".3" filter="url(#chao)"/>
  <!-- azul (papel) -->
  <g transform="translate(14 104)">
    <g filter="url(#massa)" fill="#1f78d1"><use href="#corpo" width="48" height="64" y="12"/></g>
    <g filter="url(#massa)" fill="#1764b4"><rect x="-4" y="0" width="56" height="13" rx="6.5"/><rect x="16" y="-6" width="16" height="9" rx="4.5"/></g>
    <use href="#reciclar" x="12" y="28" width="24" height="24" opacity=".85"/>
  </g>
  <!-- vermelha (plástico) -->
  <g transform="translate(68 84)">
    <g filter="url(#massa)" fill="#e5483d"><use href="#corpo" width="48" height="84" y="12" preserveAspectRatio="none"/></g>
    <g filter="url(#massa)" fill="#c63a30"><rect x="-4" y="0" width="56" height="13" rx="6.5"/><rect x="16" y="-6" width="16" height="9" rx="4.5"/></g>
    <use href="#reciclar" x="11" y="38" width="26" height="26"/>
  </g>
  <!-- verde (vidro) -->
  <g transform="translate(124 84)">
    <g filter="url(#massa)" fill="#36a852"><use href="#corpo" width="48" height="84" y="12" preserveAspectRatio="none"/></g>
    <g filter="url(#massa)" fill="#2a8a42"><rect x="-4" y="0" width="56" height="13" rx="6.5"/><rect x="16" y="-6" width="16" height="9" rx="4.5"/></g>
    <use href="#reciclar" x="11" y="38" width="26" height="26"/>
  </g>
  <!-- amarela (metal) -->
  <g transform="translate(178 104)">
    <g filter="url(#massa)" fill="#ffc928"><use href="#corpo" width="48" height="64" y="12"/></g>
    <g filter="url(#massa)" fill="#e9ad00"><rect x="-4" y="0" width="56" height="13" rx="6.5"/><rect x="16" y="-6" width="16" height="9" rx="4.5"/></g>
    <g opacity=".9"><use href="#reciclar" x="12" y="28" width="24" height="24" style="filter:brightness(.55)"/></g>
  </g>
  <!-- garrafinha caindo na lixeira vermelha -->
  <g transform="translate(118 20) rotate(28)" filter="url(#massa)">
    <rect x="-9" y="8" width="18" height="40" rx="7" fill="#9fdcff"/>
    <rect x="-5" y="0" width="10" height="11" rx="3" fill="#9fdcff"/>
    <rect x="-6" y="-6" width="12" height="7" rx="2.5" fill="#1f78d1"/>
  </g>
  <rect x="-5" y="26" width="10" height="12" rx="2" transform="translate(118 20) rotate(28)" fill="#fff" opacity=".7"/>
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85"><path d="M78 30l-9-7"/><path d="M74 48h-12"/><path d="M160 26l8-9"/></g>
</svg>
