<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- EcoKids: ilustração do Caça-palavras (desenho próprio do projeto, estilo massinha). Palavra marcada: TERRA -->
  <defs>
    <filter id="massa" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feSpecularLighting in="b" surfaceScale="5" specularConstant=".75" specularExponent="30" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="48"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="brilho"/>
      <feOffset in="SourceAlpha" dx="-5" dy="-7"/><feGaussianBlur stdDeviation="5" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="arithmetic" k2="1" k3="-1" result="borda"/>
      <feFlood flood-color="#2a1200" flood-opacity=".3"/><feComposite in2="borda" operator="in" result="sombra"/>
      <feMerge result="m"><feMergeNode in="SourceGraphic"/><feMergeNode in="sombra"/></feMerge>
      <feComposite in="m" in2="brilho" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="chao" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="vidro"><circle cx="168" cy="146" r="30"/></clipPath>
  </defs>
  <ellipse cx="116" cy="186" rx="90" ry="8" fill="#2a1200" opacity=".3" filter="url(#chao)"/>
  <!-- folha de letras -->
  <g filter="url(#massa)"><rect x="20" y="20" width="176" height="152" rx="24" fill="#fff6df"/></g>
  <!-- marca da palavra encontrada -->
  <g filter="url(#massa)"><rect x="34" y="70" width="148" height="30" rx="15" fill="#a7e06a"/></g>
  <g id="letras" font-family="Fredoka, 'Arial Rounded MT Bold', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" fill="#8a5530" text-anchor="middle">
    <text x="49" y="56">B</text><text x="78" y="56">O</text><text x="108" y="56">X</text><text x="138" y="56">L</text><text x="167" y="56">U</text>
    <g fill="#1d5a3b"><text x="49" y="92">T</text><text x="78" y="92">E</text><text x="108" y="92">R</text><text x="138" y="92">R</text><text x="167" y="92">A</text></g>
    <text x="49" y="128">M</text><text x="78" y="128">S</text><text x="108" y="128">O</text><text x="138" y="128">L</text><text x="167" y="128">Q</text>
    <text x="49" y="162">F</text><text x="78" y="162">I</text><text x="108" y="162">G</text><text x="138" y="162">A</text><text x="167" y="162">D</text>
  </g>
  <!-- lupa: o vidro aumenta as letras de baixo -->
  <g clip-path="url(#vidro)">
    <circle cx="168" cy="146" r="30" fill="#e6f6ff"/>
    <use href="#letras" transform="translate(168 146) scale(1.45) translate(-168 -146)"/>
    <path d="M148 130a24 24 0 0 1 20-10" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".9"/>
  </g>
  <g filter="url(#massa)">
    <circle cx="168" cy="146" r="34" fill="none" stroke="#2f86c6" stroke-width="10"/>
    <path d="M194 172l22 18" stroke="#e5483d" stroke-width="17" stroke-linecap="round"/>
  </g>
  <g stroke="#ffd447" stroke-width="5.5" stroke-linecap="round"><path d="M208 30l8-10"/><path d="M214 48l12-3"/></g>
</svg>
