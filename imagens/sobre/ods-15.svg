<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- EcoKids: ícone do ODS 15 - Vida terrestre (desenho próprio, estilo massinha; não é o ícone oficial da ONU) -->
  <defs>
    <filter id="massa" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feSpecularLighting in="b" surfaceScale="5" specularConstant=".75" specularExponent="30" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="48"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="brilho"/>
      <feOffset in="SourceAlpha" dx="-5" dy="-7"/><feGaussianBlur stdDeviation="5" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="arithmetic" k2="1" k3="-1" result="borda"/>
      <feFlood flood-color="#0b2200" flood-opacity=".3"/><feComposite in2="borda" operator="in" result="sombra"/>
      <feMerge result="m"><feMergeNode in="SourceGraphic"/><feMergeNode in="sombra"/></feMerge>
      <feComposite in="m" in2="brilho" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="chao" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <ellipse cx="120" cy="184" rx="92" ry="9" fill="#0b2200" opacity=".3" filter="url(#chao)"/>
  <!-- chão de terra -->
  <g filter="url(#massa)" fill="#9a6a3d"><path d="M30 182c4-22 40-34 90-34s86 12 90 34Z"/></g>
  <!-- tronco -->
  <g filter="url(#massa)" fill="#8b5a2b"><path d="M108 160c4-22 4-44 0-70h24c-4 26-4 48 0 70Z"/><path d="M118 112c-10-6-18-14-22-24l8-4c4 8 10 14 18 18Z"/></g>
  <!-- copa -->
  <g filter="url(#massa)" fill="#2e8b3a"><circle cx="86" cy="76" r="34"/><circle cx="154" cy="76" r="34"/><circle cx="120" cy="50" r="40"/><circle cx="104" cy="92" r="26"/><circle cx="138" cy="92" r="26"/></g>
  <g fill="#a7e06a" opacity=".85"><ellipse cx="104" cy="34" rx="12" ry="7" transform="rotate(-25 104 34)"/><ellipse cx="72" cy="64" rx="7" ry="4.5" transform="rotate(-30 72 64)"/></g>
  <!-- frutinhas -->
  <g filter="url(#massa)" fill="#ff5a4e"><circle cx="146" cy="56" r="7"/><circle cx="94" cy="88" r="6.5"/><circle cx="166" cy="92" r="6.5"/></g>
  <!-- joaninha no chão -->
  <g transform="translate(176 160)">
    <g filter="url(#massa)"><ellipse cx="0" cy="0" rx="15" ry="12" fill="#e5483d"/><circle cx="-14" cy="-2" r="7" fill="#2d2d2d"/></g>
    <path d="M1-12v24" stroke="#2d2d2d" stroke-width="2.4"/><circle cx="-5" cy="-3" r="2.6" fill="#2d2d2d"/><circle cx="6" cy="4" r="2.6" fill="#2d2d2d"/><circle cx="7" cy="-5" r="2.2" fill="#2d2d2d"/>
  </g>
  <!-- florzinha -->
  <g transform="translate(58 160)"><path d="M0 14V-4" stroke="#3f9a37" stroke-width="4" stroke-linecap="round"/><g filter="url(#massa)" fill="#fff"><circle cx="0" cy="-16" r="7"/><circle cx="10" cy="-8" r="7"/><circle cx="-10" cy="-8" r="7"/><circle cx="6" cy="2" r="7"/><circle cx="-6" cy="2" r="7"/></g><circle cx="0" cy="-6" r="6" fill="#ffc531"/></g>
</svg>
