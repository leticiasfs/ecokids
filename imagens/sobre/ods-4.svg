<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <!-- EcoKids: ícone do ODS 4 - Educação de qualidade (desenho próprio, estilo massinha; não é o ícone oficial da ONU) -->
  <defs>
    <filter id="massa" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feSpecularLighting in="b" surfaceScale="5" specularConstant=".75" specularExponent="30" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="48"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="brilho"/>
      <feOffset in="SourceAlpha" dx="-5" dy="-7"/><feGaussianBlur stdDeviation="5" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="arithmetic" k2="1" k3="-1" result="borda"/>
      <feFlood flood-color="#2a0005" flood-opacity=".3"/><feComposite in2="borda" operator="in" result="sombra"/>
      <feMerge result="m"><feMergeNode in="SourceGraphic"/><feMergeNode in="sombra"/></feMerge>
      <feComposite in="m" in2="brilho" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="chao" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <ellipse cx="120" cy="182" rx="88" ry="9" fill="#2a0005" opacity=".3" filter="url(#chao)"/>
  <!-- capa do livro -->
  <g filter="url(#massa)" fill="#2f86c6"><path d="M18 74c34-10 70-6 102 12 32-18 68-22 102-12v92c-34-10-70-6-102 12-32-18-68-22-102-12Z"/></g>
  <!-- páginas -->
  <g filter="url(#massa)" fill="#fff7e4">
    <path d="M28 66c30-9 62-5 88 10v90c-26-15-58-19-88-10Z"/>
    <path d="M212 66c-30-9-62-5-88 10v90c26-15 58-19 88-10Z"/>
  </g>
  <g fill="none" stroke="#e0cfa8" stroke-width="4" stroke-linecap="round"><path d="M42 92c20-4 40-2 60 6"/><path d="M42 110c20-4 40-2 60 6"/><path d="M42 128c20-4 40-2 60 6"/><path d="M198 92c-20-4-40-2-60 6"/><path d="M198 110c-20-4-40-2-60 6"/></g>
  <!-- broto saindo do livro -->
  <path d="M120 78V40" stroke="#3f9a37" stroke-width="7" stroke-linecap="round"/>
  <g filter="url(#massa)"><path d="M120 54C100 56 86 46 84 26c20-2 34 8 36 28Z" fill="#6cc04a"/><path d="M120 46c0-20 14-32 36-32 0 22-14 33-36 32Z" fill="#58b043"/></g>
  <!-- lápis -->
  <g transform="translate(172 140) rotate(-40)">
    <g filter="url(#massa)"><rect x="-30" y="-8" width="52" height="16" rx="5" fill="#ffc531"/><rect x="-42" y="-8" width="14" height="16" rx="5" fill="#ff8fab"/></g>
    <path d="M21-8 40 0 21 8Z" fill="#f8d9a8" stroke="#f8d9a8" stroke-width="2" stroke-linejoin="round"/><path d="M33-3 40 0 33 3Z" fill="#4a3426"/>
  </g>
  <g stroke="#ffd447" stroke-width="5.5" stroke-linecap="round"><path d="M66 30l8 9"/><path d="M178 28l-8 9"/><path d="M188 46l12-3"/></g>
</svg>
