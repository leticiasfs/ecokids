<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoKids - Muito bem!</title>
  <meta name="description" content="EcoKids: jogos e dicas rápidas com o Tito para crianças de 6 a 11 anos aprenderem a cuidar do planeta.">
  <meta name="theme-color" content="#1d5a3b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=29">
  <script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("ecokids-tema");if(t==="escuro"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.tema="escuro"}catch(e){}</script>
</head>
<body>
  <main class="page completion-page com-cenario">
    <!-- Cabeçalho: logo e menu (igual em todas as páginas) -->
    <header class="site-header">
      <a class="logo-pill" href="index.html"><svg class="icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M51 11C31 12 15 21 13 42c11 3 23 0 31-8 8-8 8-17 7-23Z"/><path d="M14 47c8-12 17-20 30-27"/></svg><span>EcoKids</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal"><span class="menu-bars" aria-hidden="true"><span></span><span></span><span></span></span><span class="menu-label">Menu</span></button>
      <nav class="nav-links" id="menu-principal" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="aprenda.html">Aprenda</a>
        <a href="jogos.html">Jogos</a>
        <a href="sobre.html">Sobre</a>
        <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Mudar para o tema escuro"><svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3 7 7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></svg><svg class="lua" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"/></svg></button>
        <a class="clay-button yellow" href="jogos.html">Jogar</a>
      </nav>
    </header>
    <!-- Desenhos do cenário (flor, arbusto, tufo de grama e nuvem), reaproveitados várias vezes com <use> -->
    <svg class="cena-defs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="g-folha" cx="35%" cy="25%" r="85%"><stop offset="0" class="c-folha-luz"/><stop offset="1" class="c-folha-sombra"/></radialGradient>
        <radialGradient id="g-arbusto" cx="38%" cy="22%" r="80%"><stop offset="0" class="c-arbusto-luz"/><stop offset=".6" class="c-arbusto-meio"/><stop offset="1" class="c-arbusto-sombra"/></radialGradient>
        <radialGradient id="g-volume" cx="32%" cy="26%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></radialGradient>
        <radialGradient id="g-nuvem" cx="40%" cy="22%" r="85%"><stop offset="0" class="c-nuvem-luz"/><stop offset=".7" class="c-nuvem-meio"/><stop offset="1" class="c-nuvem-sombra"/></radialGradient>
        <linearGradient id="g-colina-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="c-colina1-topo"/><stop offset="1" class="c-colina1-base"/></linearGradient>
        <linearGradient id="g-colina-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="c-colina2-topo"/><stop offset="1" class="c-colina2-base"/></linearGradient>
        <linearGradient id="g-colina-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="c-colina3-topo"/><stop offset="1" class="c-colina3-base"/></linearGradient>
        <!-- flor: a cor das pétalas vem do CSS (color) -->
        <symbol id="flor" viewBox="0 0 60 112">
          <path d="M30 112C31 92 28 70 30 44" fill="none" stroke="#4c9a33" stroke-width="5" stroke-linecap="round"/>
          <path d="M30 92C17 89 10 78 12 68c11 1 18 10 18 24Z" fill="url(#g-folha)"/>
          <path d="M30 80c12-3 19-12 18-22-11 1-18 9-18 22Z" fill="url(#g-folha)"/>
          <g fill="currentColor"><circle cx="30" cy="17" r="11"/><circle cx="42.4" cy="26" r="11"/><circle cx="37.6" cy="40.5" r="11"/><circle cx="22.4" cy="40.5" r="11"/><circle cx="17.6" cy="26" r="11"/></g>
          <g fill="url(#g-volume)"><circle cx="30" cy="17" r="11"/><circle cx="42.4" cy="26" r="11"/><circle cx="37.6" cy="40.5" r="11"/><circle cx="22.4" cy="40.5" r="11"/><circle cx="17.6" cy="26" r="11"/></g>
          <circle cx="30" cy="30" r="8.5" fill="#ffc93c"/><circle cx="30" cy="30" r="8.5" fill="url(#g-volume)"/>
        </symbol>
        <symbol id="arbusto" viewBox="0 0 200 120">
          <g fill="url(#g-arbusto)"><circle cx="48" cy="84" r="40"/><circle cx="152" cy="84" r="40"/><circle cx="100" cy="62" r="54"/><circle cx="74" cy="98" r="30"/><circle cx="128" cy="98" r="32"/></g>
          <g fill="#fff" opacity=".28"><ellipse cx="84" cy="36" rx="16" ry="9" transform="rotate(-20 84 36)"/><ellipse cx="34" cy="64" rx="9" ry="5" transform="rotate(-25 34 64)"/><ellipse cx="142" cy="62" rx="9" ry="5" transform="rotate(-20 142 62)"/></g>
        </symbol>
        <symbol id="tufo" viewBox="0 0 60 42">
          <g fill="url(#g-folha)"><path d="M10 42C12 27 13 16 6 4c14 9 17 23 15 38Z"/><path d="M24 42c1-19 4-30 6-42 7 13 8 28 5 42Z"/><path d="M37 42c2-13 8-24 18-32-2 14-6 24-8 32Z"/></g>
        </symbol>
        <symbol id="nuvem" viewBox="0 0 200 92">
          <path d="M30 88C9 88 3 68 17 59c-4-19 16-30 33-22 6-21 35-29 51-12 12-19 47-17 53 9 21-4 40 11 34 29 13 8 7 25-10 25Z" fill="url(#g-nuvem)"/>
          <path d="M56 40c4-12 19-19 33-12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>
        </symbol>
      </defs>
    </svg>
    <!-- Estrelas de massinha: cores (cheia e vazia) e o filtro que dá volume -->
    <svg class="cena-defs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="g-estrela" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#fff6b8"/><stop offset=".45" stop-color="#ffd23f"/><stop offset="1" stop-color="#f29f0d"/></radialGradient>
        <radialGradient id="g-estrela-vazia" cx="38%" cy="30%" r="75%"><stop offset="0" class="c-vazia-luz"/><stop offset="1" class="c-vazia-sombra"/></radialGradient>
        <filter id="ek-massa-estrela" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
          <feSpecularLighting in="b" surfaceScale="4" specularConstant=".8" specularExponent="24" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="50"/></feSpecularLighting>
          <feComposite in="s" in2="SourceAlpha" operator="in" result="brilho"/>
          <feOffset in="SourceAlpha" dx="-3" dy="-4"/><feGaussianBlur stdDeviation="3" result="o"/>
          <feComposite in="SourceAlpha" in2="o" operator="arithmetic" k2="1" k3="-1" result="borda"/>
          <feFlood flood-color="#7a3d00" flood-opacity=".28"/><feComposite in2="borda" operator="in" result="sombra"/>
          <feMerge result="m"><feMergeNode in="SourceGraphic"/><feMergeNode in="sombra"/></feMerge>
          <feComposite in="m" in2="brilho" operator="arithmetic" k2="1" k3="1"/>
        </filter>
      </defs>
    </svg>
    <!-- Cenário (só decoração): céu com nuvens, colinas e plantas, atrás do conteúdo -->
    <div class="cena cena-pagina" aria-hidden="true">
      <svg class="nuvem n1"><use href="#nuvem"/></svg>
      <svg class="nuvem n2"><use href="#nuvem"/></svg>
      <svg class="nuvem n3"><use href="#nuvem"/></svg>
      <svg class="nuvem n4"><use href="#nuvem"/></svg>
      <svg class="colinas" viewBox="0 0 1440 300" preserveAspectRatio="none">
        <path d="M0 150C180 70 360 80 520 130c180 55 340-40 520-35 180 5 290 55 400 25v180H0Z" fill="url(#g-colina-1)"/>
        <path d="M0 150C180 70 360 80 520 130c180 55 340-40 520-35 180 5 290 55 400 25" class="colina-brilho" vector-effect="non-scaling-stroke"/>
        <path d="M0 205c220-60 420-50 620-5 200 45 380-30 580-25 120 3 190 20 240 15v105H0Z" fill="url(#g-colina-2)"/>
        <path d="M0 205c220-60 420-50 620-5 200 45 380-30 580-25 120 3 190 20 240 15" class="colina-brilho" vector-effect="non-scaling-stroke"/>
        <path d="M0 252c240-35 480-25 720-2 240 22 480-23 720-13v63H0Z" fill="url(#g-colina-3)"/>
        <path d="M0 252c240-35 480-25 720-2 240 22 480-23 720-13" class="colina-brilho" vector-effect="non-scaling-stroke"/>
      </svg>
      <svg class="planta arbusto a1"><use href="#arbusto"/></svg>
      <svg class="planta arbusto a2"><use href="#arbusto"/></svg>
      <svg class="planta arbusto a3"><use href="#arbusto"/></svg>
      <svg class="planta flor f1"><use href="#flor"/></svg>
      <svg class="planta flor f2"><use href="#flor"/></svg>
      <svg class="planta flor f3"><use href="#flor"/></svg>
      <svg class="planta flor f4"><use href="#flor"/></svg>
      <svg class="planta flor f5"><use href="#flor"/></svg>
      <svg class="planta flor f6"><use href="#flor"/></svg>
      <svg class="planta tufo t1"><use href="#tufo"/></svg>
      <svg class="planta tufo t2"><use href="#tufo"/></svg>
      <svg class="planta tufo t3"><use href="#tufo"/></svg>
      <svg class="planta tufo t4"><use href="#tufo"/></svg>
    </div>
    <!-- Resultado: o Tito ao lado e o painel de massinha com as estrelas no centro -->
    <section class="completion-content">
      <div class="completion-tito">
        <!-- A expressão do Tito muda de acordo com as estrelas (veja o bloco 7 do js/script.js) -->
        <div class="mascot mascot-happy rosto-feliz" role="img" aria-label="Tito, a tartaruga do EcoKids"></div>
        <!-- arbusto na frente: as imagens de expressão do Tito são só do busto -->
        <svg class="planta tito-moita" aria-hidden="true"><use href="#arbusto"/></svg>
      </div>
      <div class="placar-final">
        <span class="completion-kicker" id="resultado-jogo">Fim de jogo!</span>
        <h1 id="resultado-titulo">Muito bem!</h1>
        <p id="resultado-frase">Você completou o jogo!</p>
        <!-- As 5 estrelas são criadas pelo JavaScript (bloco 7), de acordo com o resultado do jogo -->
        <div class="star-row" id="estrelas"></div>
        <p class="estrelas-contagem" id="estrelas-contagem" aria-hidden="true"></p>
        <p class="resultado-detalhe" id="resultado-detalhe" hidden></p>
        <div class="completion-actions">
          <!-- O JavaScript troca o endereço deste botão para o jogo que acabou (bloco 7) -->
          <a class="clay-button dark" id="jogar-de-novo" href="jogos.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>Jogar novamente</a>
          <a class="clay-button light" href="jogos.html"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2.5"/><rect x="13" y="3" width="8" height="8" rx="2.5"/><rect x="3" y="13" width="8" height="8" rx="2.5"/><rect x="13" y="13" width="8" height="8" rx="2.5"/></svg>Voltar aos jogos</a>
        </div>
      </div>
    </section>
  </main>
  <script src="js/script.js?v=27"></script>
  <script src="js/tito.js?v=21"></script>
</body>
</html>
