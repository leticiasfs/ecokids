<!DOCTYPE html>

  <main class="page games-page">

    <header class="site-header">
      <a class="logo-pill" href="index.html"><svg class="icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M51 11C31 12 15 21 13 42c11 3 23 0 31-8 8-8 8-17 7-23Z"/><path d="M14 47c8-12 17-20 30-27"/></svg><span>EcoKids</span></a>

            <strong>Quiz</strong>
            <small>para quem já lê</small>

            <span class="large-icon"><svg class="icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="28" cy="28" r="16"/><path d="m40 40 12 12"/></svg></span>
            <strong>Caça-palavras</strong>
            <small>para quem já lê</small>
