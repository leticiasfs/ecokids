<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoKids - Lixeira certa</title>
  <link rel="stylesheet" href="css/style.css?v=9">
  <script>try{if(localStorage.getItem("ecokids-tema")==="escuro")document.documentElement.dataset.tema="escuro"}catch(e){}</script>
</head>
<body>
  <main class="page game-page trash-page">
    <!-- Cabeçalho: logo e menu (igual em todas as páginas) -->
    <header class="site-header">
      <a class="logo-pill" href="index.html"><svg class="icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M51 11C31 12 15 21 13 42c11 3 23 0 31-8 8-8 8-17 7-23Z"/><path d="M14 47c8-12 17-20 30-27"/></svg><span>EcoKids</span></a>
      <nav class="nav-links" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="aprenda.html">Aprenda</a>
        <a href="jogos.html">Jogos</a>
        <a href="sobre.html">Sobre</a>
        <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Mudar para o tema escuro"><svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3 7 7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></svg><svg class="lua" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"/></svg></button>
        <a class="clay-button yellow" href="jogos.html">Jogar</a>
      </nav>
    </header>
    <div class="game-content">
        <!-- Barra de cima do jogo: voltar, título e pontos -->
        <div class="game-bar">
          <a class="clay-button light" href="jogos.html">Voltar</a>
          <h1>Lixeira certa</h1>
          <span class="score-pill clay" id="placar">Acertos: 0</span>
        </div>
        <div class="trash-prompt-row">
          <div class="mascot mascot-thinking rosto-curioso" role="img" aria-label="Tito, a tartaruga do EcoKids"></div>
          <section class="trash-prompt clay">
            <span>Onde jogar este item?</span>
            <!-- A imagem do item muda pelo JavaScript (lista "itens" no js/script.js) -->
            <img id="item-imagem" class="item-imagem" src="imagens/lixeira/garrafa-pet.jpg" alt="Item para jogar fora">
            <small id="item-dica"></small>
          </section>
        </div>
        <div class="big-bins" id="lixeiras">
          <button class="big-bin-option" data-lixeira="Papel">
            <span class="bin-lid blue"></span>
            <span class="big-bin clay blue"><svg class="bin-symbol" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></svg></span>
            <strong>Papel</strong>
          </button>
          <button class="big-bin-option" data-lixeira="Plástico">
            <span class="bin-lid red"></span>
            <span class="big-bin clay red"><svg class="bin-symbol" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></svg></span>
            <strong>Plástico</strong>
          </button>
          <button class="big-bin-option" data-lixeira="Vidro">
            <span class="bin-lid green"></span>
            <span class="big-bin clay green"><svg class="bin-symbol" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></svg></span>
            <strong>Vidro</strong>
          </button>
          <button class="big-bin-option" data-lixeira="Metal">
            <span class="bin-lid yellow"></span>
            <span class="big-bin clay yellow"><svg class="bin-symbol" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></svg></span>
            <strong>Metal</strong>
          </button>
          <button class="big-bin-option" data-lixeira="Orgânico">
            <span class="bin-lid brown"></span>
            <span class="big-bin clay brown"><svg class="bin-symbol" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></svg></span>
            <strong>Orgânico</strong>
          </button>
        </div>
    </div>
    <!-- Colinas verdes decorativas do rodapé -->
    <div class="hills" aria-hidden="true">
      <svg viewBox="0 0 1440 116" preserveAspectRatio="none">
        <path class="hill-back" d="M0 64C218 16 394 38 566 70c192 36 363 32 565-2 153-26 215-51 309 0v48H0Z"/>
        <path class="hill-front" d="M0 86c208-25 375-27 572 0 263 36 461 20 868-7v37H0Z"/>
      </svg>
      <div></div>
    </div>
  </main>
  <script src="js/script.js?v=9"></script>
</body>
</html>
